# Mini-Router 生产环境配置
#
# 配置来源逻辑：
# - database.enabled=false: models/signals/decisions 从 YAML 加载
# - database.enabled=true: 从 mini_router_config.config_data 加载（YAML 只提供连接信息）
#
# 生产环境启用数据库，全局配置存储在 mini_router_config 表中

server:
  host: "0.0.0.0"
  port: 8080

database:
  enabled: true
  host: "1.94.232.185"  # 实际测试数据库地址
  port: 3306
  user: "root"
  database: "mini_router"
  min_connections: 2
  max_connections: 10

# database.enabled=true 时，以下配置从 mini_router_config.config_data 加载
# YAML 中的配置会被忽略（仅作为初始化数据库时的参考）
