# Mini-Router 生产环境配置
# 注意：当 database.enabled=true 时，models/signals/decisions 等配置从数据库加载
# 此文件只提供数据库连接信息和基础 server 配置

server:
  host: "0.0.0.0"
  port: 8080

# 数据库配置（生产环境启用）
database:
  enabled: true
  host: "mysql.prod.internal"  # 替换为实际生产数据库地址
  port: 3306
  user: "mini_router"
  database: "mini_router"
  min_connections: 5
  max_connections: 20

