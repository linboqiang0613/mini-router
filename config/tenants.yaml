tenants:
- tenant_id: demo-tenant
  apikey: sk-demo-auth-key
  apikey_pool:
  - sk-llm-key-1
  - sk-llm-key-2
  - sk-llm-key-3
  apikey_pool_mode: round_robin
  name: Demo Tenant
  enabled: true
  base_url_template: https://coding.dashscope.aliyuncs.com/llm/{model}/v1
  timeout: 120.0
  decisions:
  - name: block_pii
    priority: 100
    rules:
      type: signal
      name: null
      signal: pii
      condition: detected
      children: []
    model_refs: []
    action: reject
    reject_message: PII detected in request. Please remove personal information.
  - name: block_security_threat
    priority: 99
    rules:
      type: signal
      name: null
      signal: security
      condition: detected
      children: []
    model_refs: []
    action: reject
    reject_message: Security threat detected. Request blocked.
  - name: route_long_context
    priority: 90
    rules:
      type: signal
      name: null
      signal: context_length
      condition: long
      children: []
    model_refs:
    - model: qwen3-max-2026-01-23
      weight: 1.0
      max_tokens: 32768
    action: route
    reject_message: null
  - name: route_complex_query
    priority: 50
    rules:
      type: signal
      name: null
      signal: complexity
      condition: complex
      children: []
    model_refs:
    - model: kimi-k2.5
      weight: 1.0
      max_tokens: null
    action: route
    reject_message: null
  - name: route_to_code_model
    priority: 10
    rules:
      type: keyword
      name: code_related
      signal: null
      condition: null
      children: []
    model_refs:
    - model: qwen3-coder-next
      weight: 1.0
      max_tokens: null
    - model: qwen3-coder-plus
      weight: 0.8
      max_tokens: null
    action: route
    reject_message: null
  - name: route_to_math_model
    priority: 5
    rules:
      type: keyword
      name: math_related
      signal: null
      condition: null
      children: []
    model_refs:
    - model: glm-4.7
      weight: 1.0
      max_tokens: null
    action: route
    reject_message: null
  - name: default_route
    priority: 0
    rules:
      type: or
      name: null
      signal: null
      condition: null
      children:
      - type: keyword
        name: code_related
        signal: null
        condition: null
        children: []
      - type: keyword
        name: math_related
        signal: null
        condition: null
        children: []
    model_refs:
    - model: qwen3.5-plus
      weight: 1.0
      max_tokens: null
    action: route
    reject_message: null
  - name: catch_all
    priority: -100
    rules:
      type: or
      name: null
      signal: null
      condition: null
      children:
      - type: signal
        name: null
        signal: complexity
        condition: simple
        children: []
      - type: signal
        name: null
        signal: complexity
        condition: complex
        children: []
    model_refs:
    - model: qwen3.5-plus
      weight: 1.0
      max_tokens: null
    action: route
    reject_message: null
  selection:
    strategy: latency_aware
    latency_aware:
      tpot_percentile: 50
      ttft_percentile: 90
      latency_percentile: 50
      min_observations: 3
      fallback_to_weight: true
      weight_blend: 0.3
  created_at: null
  updated_at: null
