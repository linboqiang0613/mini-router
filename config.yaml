# Mini-Router 配置文件

# 服务配置
server:
  host: "0.0.0.0"
  port: 8080
  max_workers: 10

# 模型配置
models:
  base_url: "https://coding.dashscope.aliyuncs.com/v1"  # 大模型 API 地址
  api_key: "None"      # API Key (本地部署可留空)
  tokenizer_path: "~/Qwen3-tokenizer"
  timeout: 120.0                                          # 请求超时时间(秒)

  # 分类器配置
  classifier:
    intent:
      model: "qwen3.5-plus"
      enabled: true
      timeout: 50.0
      fallback_label: null
      extra_params:
        chat_template_kwargs:
          enable_thinking: false
    pii:
      model: "qwen3.5-plus"
      enabled: true
      timeout: 50.0
      fallback_label: "detected"
      extra_params:
        chat_template_kwargs:
          enable_thinking: false
    security:
      model: "qwen3.5-plus"
      enabled: true
      timeout: 50.0
      fallback_label: "detected"
      extra_params:
        chat_template_kwargs:
          enable_thinking: false
    complexity:
      model: "qwen3.5-plus"
      enabled: true
      timeout: 50.0
      fallback_label: "complex"
      extra_params:
        chat_template_kwargs:
          enable_thinking: false
    context_length:                            # NEW: 上下文长度分类器
      model: "context-length-classifier"       # 模型名（本地计算，不需要实际 API）
      enabled: true
      timeout: 5.0
      fallback_label: "short"
      threshold: 10  # 测试用，上下文长度的阈值

  # 嵌入模型配置 (用于语义缓存)
  embedder:
    model: "text-embedding-model"
    enabled: false

# 信号规则
signals:
  keyword_rules:
    - name: "code_related"
      keywords: ["code", "programming", "function", "debug", "error", "python", "java", "golang"]
      operator: "any"
      case_sensitive: false

    - name: "math_related"
      keywords: ["calculate", "math", "equation", "solve", "compute", "formula"]
      operator: "any"
      case_sensitive: false

    - name: "translation"
      keywords: ["translate", "翻译", "language", "语言"]
      operator: "any"
      case_sensitive: false

  embedding_rules: []

  categories: []

# 缓存配置
cache:
  enabled: true
  similarity_threshold: 0.95
  max_entries: 10000
